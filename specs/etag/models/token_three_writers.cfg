\* Expected: no error.
\* Three writers with one write each, two fillers, writer fills, no savepoints.
CONSTANTS
    Parents = {p1, p2}
    Children = {c1, c2}
    Txs = {t1, t2, t3}
    Fillers = {f1, f2}
    OwnValues = {0, 1}
    NoParent = NoParent
    MaxWrites = 1
    Ops = {"insert", "delete", "move", "touch", "own"}
    Savepoints = FALSE
    NoTok = NoTok
    Bottom = Bottom
    FreshToken = TRUE
    InvalidateInTx = TRUE
    TokenFirst = TRUE
    CompareAndSet = TRUE
    WriterFills = TRUE
    FillUnderLock = TRUE
    DropFillOnWrite = TRUE
    BatchedTxs = {}
    FlushBeforeCommit = TRUE
SPECIFICATION Spec
INVARIANT TypeOK NeverWrong
VIEW NoHist
SYMMETRY Sym

\* Expected: no error.
\* One writer batches, the other invalidates at once.
CONSTANTS
    Parents = {p1, p2}
    Children = {c1, c2}
    Txs = {t1, t2}
    Fillers = {f1}
    OwnValues = {0, 1}
    NoParent = NoParent
    MaxWrites = 2
    Ops = {"insert", "delete", "move", "touch", "own"}
    Savepoints = TRUE
    NoTok = NoTok
    Bottom = Bottom
    FreshToken = TRUE
    InvalidateInTx = TRUE
    TokenFirst = TRUE
    CompareAndSet = TRUE
    WriterFills = TRUE
    FillUnderLock = TRUE
    DropFillOnWrite = TRUE
    BatchedTxs = {t1}
    FlushBeforeCommit = TRUE
SPECIFICATION Spec
INVARIANT TypeOK NeverWrong
VIEW NoHist
SYMMETRY Sym
